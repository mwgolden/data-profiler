<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{{ report.title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 30px;
        }

        .report-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 20px;
        }

        .report-header {
            margin-bottom: 40px;
        }

        .table-section {
            margin-bottom: 50px;
        }

       .pct-bar {
            width: 120px;
            height: 8px;
            background: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
        }

        .pct-bar-fill {
            height: 100%;
            background: #0d6efd;
            border-radius: 4px;
        }

    </style>
</head>

<body>
<div class="report-header">
    <h1>{{ report.title }}</h1>
    <p>Source: {{ report.source_file }}</p>
</div>
<div class="report-container">
    {% from "table.html" import render_table %}
    {% for table in report.tables %}
    <section class="table-section">
        {{ render_table(table.title, table.headers, table.rows) }}
    </section>
    {% endfor %}
</div>

</body>
</html>
