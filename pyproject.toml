[project]
name = "data-profiler"
version = "0.1.0"
description = "cli tool to profile data in various formats"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["pandas"]

[project.scripts]
profile = "profile_cli.main:main"

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"
